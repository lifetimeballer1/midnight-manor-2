name: Web build + Pages

on:
  push:
    branches: [main, gbt]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot headless + export templates
        run: |
          set -eux
          MAJOR="${GODOT_VERSION%.*}"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/
          godot --version

      - name: Import project
        run: godot --headless --editor --import --path .

      - name: Verify assets
        run: python3 scripts/verify_assets.py

      - name: Run Python tests
        run: python3 -m pytest -q

      - name: Run gameplay regression suites
        run: |
          godot --headless --path . --script res://tests/test_village.gd -- --no-save
          godot --headless --path . --script res://tests/test_game_scene.gd -- --no-save
          godot --headless --path . --script res://tests/test_workers_defense.gd -- --no-save
          godot --headless --path . --script res://tests/test_living_village.gd -- --no-save
          godot --headless --path . --script res://tests/test_update2_scene.gd -- --no-save

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      # Standing rule: the web build must stay Safari-playable.
      # Threaded exports need COOP/COEP headers GitHub Pages cannot send,
      # so Safari (and every other browser) refuses to boot them.
      - name: Guard Safari compatibility (single-threaded)
        run: |
          grep -q 'variant/thread_support=false' export_presets.cfg \
            || (echo "FAIL: export_presets.cfg must keep variant/thread_support=false for Safari" && exit 1)
          grep -q 'GODOT_THREADS_ENABLED = false' build/web/index.html \
            || (echo "FAIL: exported index.html has threads enabled; Safari cannot boot it" && exit 1)
          echo "Safari guard PASS: single-threaded web build"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
